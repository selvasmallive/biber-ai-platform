<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BIBER AI Review</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="mast">
        <img src="../images/icon.png" alt="" class="logo" />
        <div>
          <h1>BIBER AI Review</h1>
          <p>Private PR and commit review through your BIBER API gateway.</p>
        </div>
        <span class="status-pill" id="statusPill">Session only</span>
      </section>

      <section class="panel grid" aria-label="BIBER connection">
        <label>
          API base URL
          <input id="baseUrl" value="https://api.beaverapi.com/v1" autocomplete="off" />
        </label>
        <label>
          Model
          <input id="model" value="biber-dev-core-v1" autocomplete="off" />
        </label>
        <label class="wide">
          API key
          <input id="apiKey" type="password" placeholder="Paste user API key for this session" autocomplete="off" />
        </label>
        <div class="wide connection-actions">
          <button id="testConnectionButton" type="button">Test Connection</button>
          <span id="connectionResult">Not tested</span>
        </div>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>Diff Input</h2>
          <span id="diffCounter">0 / 60000 bytes</span>
        </div>
        <label>
          Diff or commit context
          <textarea id="diffText" spellcheck="false">diff --git a/src/example.ts b/src/example.ts
--- a/src/example.ts
+++ b/src/example.ts
@@ -1,3 +1,4 @@
 export function total(values: number[]) {
+  // TODO: handle empty arrays
   return values.reduce((sum, value) => sum + value, 0);
 }</textarea>
        </label>
      </section>

      <section class="toolbar" aria-label="BIBER review actions">
        <button id="reviewButton" type="button">Generate Review</button>
        <button id="stopButton" type="button" disabled>Cancel</button>
        <button id="sampleButton" type="button">Sample Diff</button>
        <button id="clearButton" type="button">Clear Output</button>
        <button id="copyButton" type="button">Copy Review</button>
      </section>

      <section class="status-line" aria-live="polite">
        <span id="statusText">Ready for a dry review.</span>
      </section>

      <section class="output" aria-live="polite">
        <h2>Review Output</h2>
        <pre id="outputText">No review generated yet.</pre>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
