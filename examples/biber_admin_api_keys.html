<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BIBER Admin</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --panel-soft: #f1f4f8;
      --text: #18202b;
      --muted: #667085;
      --line: #d7dde6;
      --primary: #1769e0;
      --primary-dark: #0f55bb;
      --danger: #b42318;
      --danger-soft: #fef3f2;
      --success: #087443;
      --success-soft: #ecfdf3;
      --shadow: 0 8px 24px rgba(22, 34, 51, 0.08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-width: 320px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 0 14px;
      background: var(--primary);
      color: #ffffff;
      cursor: pointer;
      font-weight: 650;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button.secondary {
      background: #ffffff;
      border-color: var(--line);
      color: var(--text);
    }

    button.secondary:hover {
      background: var(--panel-soft);
    }

    button.danger {
      background: var(--danger);
    }

    button.danger:hover {
      background: #92180f;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .shell {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #111827;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #ffffff;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 650;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--muted);
    }

    .status.signed-in {
      color: var(--success);
      border-color: #abefc6;
      background: var(--success-soft);
    }

    .status.signed-in .dot {
      background: var(--success);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
    }

    .panel-body {
      padding: 18px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 14px;
    }

    label {
      color: #344054;
      font-size: 13px;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 11px;
      color: var(--text);
      background: #ffffff;
    }

    input:focus {
      outline: 3px solid rgba(23, 105, 224, 0.18);
      border-color: var(--primary);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 11px 12px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--text);
      line-height: 1.45;
      font-size: 14px;
      word-break: break-word;
    }

    .message.visible {
      display: block;
    }

    .message.error {
      border-color: #fecdca;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .message.success {
      border-color: #abefc6;
      background: var(--success-soft);
      color: var(--success);
    }

    .key-output {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #fedf89;
      background: #fffaeb;
    }

    .key-output.visible {
      display: block;
    }

    .key-value {
      width: 100%;
      margin-top: 8px;
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
    }

    .copy-actions {
      margin-top: 10px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      color: #475467;
      background: #f8fafc;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 700;
      background: var(--panel-soft);
      color: var(--muted);
    }

    .badge.active {
      background: var(--success-soft);
      color: var(--success);
    }

    .badge.revoked {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .empty {
      padding: 28px 18px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">B</div>
        <div>
          <h1>BIBER Admin</h1>
          <p class="subtitle">API keys for external agents and apps</p>
        </div>
      </div>
      <div id="auth-status" class="status"><span class="dot"></span><span>Signed out</span></div>
    </header>

    <section class="layout">
      <div class="panel">
        <div class="panel-header">
          <h2>Admin Sign In</h2>
        </div>
        <div class="panel-body">
          <form id="auth-form" autocomplete="off">
            <div class="field">
              <label for="admin-key">Admin API key</label>
              <input id="admin-key" name="admin-key" type="password" required autocomplete="off">
            </div>
            <div class="actions">
              <button type="submit">Sign In</button>
              <button id="sign-out" class="secondary" type="button">Sign Out</button>
            </div>
          </form>
          <div id="auth-message" class="message" role="status"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header toolbar">
          <h2>User API Keys</h2>
          <button id="refresh" class="secondary" type="button">Refresh</button>
        </div>
        <div class="panel-body">
          <form id="issue-form" autocomplete="off">
            <div class="field">
              <label for="user-id">User ID</label>
              <input id="user-id" name="user-id" type="text" required maxlength="128" autocomplete="off">
            </div>
            <div class="field">
              <label for="label">Label</label>
              <input id="label" name="label" type="text" maxlength="128" autocomplete="off">
            </div>
            <div class="actions">
              <button id="issue" type="submit">Issue Key</button>
            </div>
          </form>

          <div id="key-output" class="key-output">
            <strong>New user API key</strong>
            <input id="new-key" class="key-value" readonly>
            <div class="actions copy-actions">
              <button id="copy-key" class="secondary" type="button">Copy</button>
              <button id="hide-key" class="secondary" type="button">Hide</button>
            </div>
          </div>

          <div id="main-message" class="message" role="status"></div>
        </div>
        <div class="table-wrap">
          <table aria-label="User API keys">
            <thead>
              <tr>
                <th>Key ID</th>
                <th>User</th>
                <th>Label</th>
                <th>Status</th>
                <th>Created</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="keys-body">
              <tr><td colspan="6" class="empty">Sign in to load keys.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const state = { adminKey: "" };
    const authForm = document.querySelector("#auth-form");
    const issueForm = document.querySelector("#issue-form");
    const adminKeyInput = document.querySelector("#admin-key");
    const userIdInput = document.querySelector("#user-id");
    const labelInput = document.querySelector("#label");
    const authStatus = document.querySelector("#auth-status");
    const authMessage = document.querySelector("#auth-message");
    const mainMessage = document.querySelector("#main-message");
    const keysBody = document.querySelector("#keys-body");
    const keyOutput = document.querySelector("#key-output");
    const newKeyInput = document.querySelector("#new-key");

    function setMessage(node, text, type = "") {
      node.textContent = text;
      node.className = text ? `message visible ${type}`.trim() : "message";
    }

    function setSignedIn(signedIn) {
      authStatus.className = signedIn ? "status signed-in" : "status";
      authStatus.innerHTML = signedIn
        ? '<span class="dot"></span><span>Signed in</span>'
        : '<span class="dot"></span><span>Signed out</span>';
      document.querySelector("#issue").disabled = !signedIn;
      document.querySelector("#refresh").disabled = !signedIn;
    }

    function authHeaders() {
      return {
        "Authorization": `Bearer ${state.adminKey}`,
        "Content-Type": "application/json"
      };
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { ...authHeaders(), ...(options.headers || {}) }
      });
      const contentType = response.headers.get("content-type") || "";
      const payload = contentType.includes("application/json")
        ? await response.json()
        : { detail: await response.text() };
      if (!response.ok) {
        throw new Error(payload.detail || `HTTP ${response.status}`);
      }
      return payload;
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function appendTextCell(row, value) {
      const cell = document.createElement("td");
      cell.textContent = value || "";
      row.appendChild(cell);
      return cell;
    }

    function renderKeys(keys) {
      if (!keys.length) {
        keysBody.innerHTML = '<tr><td colspan="6" class="empty">No user keys yet.</td></tr>';
        return;
      }
      keysBody.innerHTML = "";
      for (const item of keys) {
        const row = document.createElement("tr");
        const status = item.active ? "active" : "revoked";
        appendTextCell(row, item.key_id);
        appendTextCell(row, item.user_id);
        appendTextCell(row, item.label);
        const statusCell = document.createElement("td");
        const statusBadge = document.createElement("span");
        statusBadge.className = `badge ${status}`;
        statusBadge.textContent = item.active ? "Active" : "Revoked";
        statusCell.appendChild(statusBadge);
        row.appendChild(statusCell);
        appendTextCell(row, formatDate(item.created_at));
        const actionCell = document.createElement("td");
        if (item.active) {
          const revoke = document.createElement("button");
          revoke.className = "danger";
          revoke.type = "button";
          revoke.textContent = "Revoke";
          revoke.addEventListener("click", () => revokeKey(item.key_id));
          actionCell.appendChild(revoke);
        }
        row.appendChild(actionCell);
        keysBody.appendChild(row);
      }
    }

    async function loadKeys() {
      if (!state.adminKey) return;
      setMessage(mainMessage, "");
      const payload = await api("/v1/admin/api-keys");
      renderKeys(payload.keys || []);
    }

    async function signIn(event) {
      event.preventDefault();
      state.adminKey = adminKeyInput.value.trim();
      if (!state.adminKey) return;
      try {
        await loadKeys();
        setSignedIn(true);
        setMessage(authMessage, "Admin key accepted.", "success");
        adminKeyInput.value = "";
      } catch (error) {
        state.adminKey = "";
        setSignedIn(false);
        setMessage(authMessage, error.message, "error");
      }
    }

    function signOut() {
      state.adminKey = "";
      adminKeyInput.value = "";
      newKeyInput.value = "";
      keyOutput.className = "key-output";
      setSignedIn(false);
      setMessage(authMessage, "Signed out.");
      setMessage(mainMessage, "");
      keysBody.innerHTML = '<tr><td colspan="6" class="empty">Sign in to load keys.</td></tr>';
    }

    async function issueKey(event) {
      event.preventDefault();
      try {
        const payload = await api("/v1/admin/api-keys", {
          method: "POST",
          body: JSON.stringify({
            user_id: userIdInput.value.trim(),
            label: labelInput.value.trim()
          })
        });
        newKeyInput.value = payload.api_key;
        keyOutput.className = "key-output visible";
        userIdInput.value = "";
        labelInput.value = "";
        setMessage(mainMessage, "User key issued.", "success");
        await loadKeys();
      } catch (error) {
        setMessage(mainMessage, error.message, "error");
      }
    }

    async function revokeKey(keyId) {
      if (!window.confirm(`Revoke key ${keyId}?`)) return;
      try {
        await api(`/v1/admin/api-keys/${encodeURIComponent(keyId)}`, { method: "DELETE" });
        setMessage(mainMessage, "User key revoked.", "success");
        await loadKeys();
      } catch (error) {
        setMessage(mainMessage, error.message, "error");
      }
    }

    authForm.addEventListener("submit", signIn);
    issueForm.addEventListener("submit", issueKey);
    document.querySelector("#sign-out").addEventListener("click", signOut);
    document.querySelector("#refresh").addEventListener("click", () => {
      loadKeys().catch((error) => setMessage(mainMessage, error.message, "error"));
    });
    document.querySelector("#copy-key").addEventListener("click", async () => {
      await navigator.clipboard.writeText(newKeyInput.value);
      setMessage(mainMessage, "Copied new user key.", "success");
    });
    document.querySelector("#hide-key").addEventListener("click", () => {
      newKeyInput.value = "";
      keyOutput.className = "key-output";
    });

    setSignedIn(false);
  </script>
</body>
</html>
