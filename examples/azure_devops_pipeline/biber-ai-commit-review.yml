# BIBER AI commit review pipeline MVP.
# Add BIBER_API_KEY as a secret pipeline variable before enabling this pipeline.

trigger:
  branches:
    include:
      - main
      - master

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  BIBER_OPENAI_BASE_URL: https://api.beaverapi.com/v1
  BIBER_MODEL: biber-dev-core-v1

steps:
  - checkout: self
    fetchDepth: 2
    persistCredentials: false

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.11"

  - bash: |
      python scripts/biber_azure_devops_pr_review.py \
        --repo-root "$(Build.SourcesDirectory)" \
        --base-url "$(BIBER_OPENAI_BASE_URL)" \
        --model "$(BIBER_MODEL)" \
        --comment-mode none \
        --output-json "$(Build.ArtifactStagingDirectory)/biber-ai-commit-review.json" \
        --output-md "$(Build.ArtifactStagingDirectory)/biber-ai-commit-review.md"
    displayName: "BIBER AI review latest commit diff"
    env:
      BIBER_API_KEY: $(BIBER_API_KEY)

  - publish: "$(Build.ArtifactStagingDirectory)"
    artifact: biber-ai-commit-review
    displayName: "Publish BIBER AI commit review artifacts"
