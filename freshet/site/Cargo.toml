[package]
name = "freshet-site"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"

# Its own workspace, for the same reason the desktop app is: the engine's
# `cargo test` should stay a two-second loop, not link a web server.
[workspace]

[dependencies]
# The licence crate the desktop app uses, unchanged. The site signs with the
# same code the app verifies with, so the two cannot drift apart.
freshet-license = { path = "../crates/freshet-license" }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "migrate",
    "macros",
] }

lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-rustls-tls",
    "builder",
] }

async-trait = "0.1"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
freshet-license = { path = "../crates/freshet-license", features = ["dev-licences"] }
tower = { version = "0.5.3", features = ["util"] }
