[package]
name = "freshet-license"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Signed licences, offline verification, and the activation boundary."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ed25519-dalek = "2"
base64 = "0.22"

[features]
# Built-in development and CRA-certification licences. MUST NOT be enabled in a
# release build: see `dev` module.
dev-licences = []

[dev-dependencies]
# Depending on itself with the feature on is how the crate's own tests exercise
# the development licences without turning them on for anyone else.
freshet-license = { path = ".", features = ["dev-licences"] }
base64 = "0.22"
ed25519-dalek = "2"
