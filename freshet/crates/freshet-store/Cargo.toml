[package]
name = "freshet-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Encrypted local vault for Freshet tax returns."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# XChaCha20-Poly1305: a 192-bit nonce, so random nonces per save have no
# practical collision risk and we never have to track a counter across restarts.
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true
